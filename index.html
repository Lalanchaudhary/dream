
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DREAM EVENT MANAGEMENT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #100d18;
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(
        circle at top,
        #39234b 0%,
        #1b1426 45%,
        #100d18 100%
      );
    }

    .hero-content {
      max-width: 850px;
      width: 100%;
    }

    .tagline {
      display: inline-block;
      padding: 10px 22px;
      border: 1px solid #d6aa65;
      color: #e9c58d;
      border-radius: 50px;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 25px;
    }

    h1 span {
      color: #e9bd77;
      display: block;
    }

    .offer {
      display: inline-block;
      margin: 15px 0 30px;
      padding: 22px 35px;
      border: 2px solid #e9bd77;
      border-radius: 14px;
      background: rgba(233, 189, 119, 0.09);
      box-shadow: 0 0 35px rgba(233, 189, 119, 0.12);
    }

    .offer h2 {
      font-size: clamp(35px, 6vw, 55px);
      color: #ffcc79;
      font-weight: 900;
    }

    .offer p {
      color: #fff;
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: 8px;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 17px 35px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      transition: 0.3s ease;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.2);
    }

    .whatsapp-btn:hover {
      background: #1ebe5d;
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.3);
    }

    .whatsapp-btn svg {
      width: 25px;
      height: 25px;
      fill: white;
    }

    .bottom-text {
      margin-top: 35px;
      color: #b9aebf;
      font-size: 13px;
      letter-spacing: 2px;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #0b0910;
      color: #8f8497;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 100svh;
        padding: 30px 18px;
      }

      .tagline {
        font-size: 11px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: 40px;
      }

      .offer {
        padding: 20px 24px;
      }

      .whatsapp-btn {
        width: 100%;
        max-width: 320px;
        font-size: 16px;
        padding: 17px 20px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">

      <div class="tagline">
        YOUR DREAM EVENT, OUR PASSION
      </div>

      <h1>
        DREAM
        <span>EVENT MANAGEMENT</span>
      </h1>

      <div class="offer">
        <h2>15% OFF</h2>
        <p>ON FIRST BOOKING</p>
      </div>

      <br />

      <a
        class="whatsapp-btn"
        href="https://wa.me/8102034465?text=I%20WANT%20TO%20KNOW%20MORE.."
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 32 32">
          <path d="M16.02 3C8.85 3 3.02 8.82 3.02 16c0 2.29.6 4.54 1.74 6.53L3 29l6.65-1.74A12.94 12.94 0 0 0 16.02 29C23.2 29 29.02 23.17 29.02 16S23.2 3 16.02 3zm0 23.85c-2.03 0-4.03-.55-5.76-1.6l-.41-.24-3.95 1.04 1.05-3.85-.27-.43a10.8 10.8 0 1 1 9.34 5.08zm5.93-8.09c-.32-.16-1.9-.94-2.19-1.05-.3-.11-.51-.16-.72.16-.22.32-.83 1.05-1.01 1.27-.19.21-.37.24-.69.08-.32-.16-1.36-.5-2.59-1.59-.96-.85-1.61-1.9-1.8-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.54.1-.21.05-.4-.03-.56-.08-.16-.72-1.74-.99-2.38-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.1-1.12 2.68s1.15 3.11 1.31 3.32c.16.21 2.26 3.45 5.48 4.84.77.33 1.37.53 1.84.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.29-.21-.61-.37z"/>
        </svg>
        BOOK NOW ON WHATSAPP
      </a>

      <div class="bottom-text">
        LET'S MAKE YOUR CELEBRATION UNFORGETTABLE
      </div>

    </div>
  </section>

  <footer>
    © 2026 DREAM EVENT MANAGEMENT. ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
